name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch Product UI
        run: node scripts/fetch-product-ui.mjs
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_UI_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
